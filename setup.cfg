[pycodestyle]
max-line-length = 88
# E203 (whitespace before ':') fires on black's own slice formatting
# (`name[len(prefix) :]`), so the two tools disagree; black wins. pycodestyle
# has no extend-ignore in config, so the default ignore list is repeated here
# verbatim -- dropping any of it would turn on checks that were never on.
ignore = E121,E123,E126,E203,E226,E24,E704,W503,W504

[pydocstyle]
convention = google
